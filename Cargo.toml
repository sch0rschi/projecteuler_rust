[package]
name = "projecteuler"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
chrono = "0.4.42"
bitvec = "1.0.1"
itertools = "0.14.0"
num-integer = "0.1.46"
phf = { version = "0.13.1", features = ["macros"] }
rustc-hash = "2.1.2"
rand = "0.10.1"
numerus = "0.1.1"
regex = "1.12.3"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
