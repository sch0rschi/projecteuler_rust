[package]
name = "projecteuler"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
chrono = "0.4.42"
bitvec = "1.0.1"
itertools = "0.14.0"
num-integer = "0.1.46"
rustc-hash = "2.1.2"
numerus = "0.1.1"
regex = "1.12.3"
smallvec = "1.15.1"
nalgebra = "0.34.2"
primal ="0.3.1"
reikna = "0.12.3"

[build-dependencies]
ureq = "3.3.0"

[profile.test]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"